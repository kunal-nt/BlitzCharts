name: Deploy to Amplify

on:
  pull_request: 
    branches: [ main, amplify-deploy-code ]
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: production
        
      - name: Build Folder
        run: ls
      
      # Amplify manual deployment requires the build folder to be zipped
      - name: Zip Build Output
        run: |
          cd out && zip -r ../build.zip . && cd ..

      - name: Deploy to AWS Amplify
        run: |
          # 1. Create a deployment and get the upload URL
          UPLOAD_URL=$(aws amplify create-deployment --app-id ${{ vars.AMPLIFY_APP_ID }} --branch-name main --query 'zipUploadUrl' --output text)
          
          # 2. Upload the zip file
          curl -H "Content-Type: application/zip" --upload-file build.zip "$UPLOAD_URL"
          
          # 3. Start the deployment job
          aws amplify start-deployment --app-id ${{ vars.AMPLIFY_APP_ID }} --branch-name main
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-south-1
