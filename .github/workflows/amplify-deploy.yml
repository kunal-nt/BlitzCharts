name: Deploy to Amplify

on:
  pull_request: 
    branches: [ main , amplify-deploy-code ]
  push:
    branches:
      - main  # or your specific branch
      - amplify-deploy-code

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: production
          # Add other env vars here if needed for build time

      - name: Deploy to Amplify
        uses: cloudposse/github-action-amplify-deploy@main
        with:
          # You can find your App ID in the Amplify Console URL or Settings
          amplify-app-id: ${{ vars.AMPLIFY_APP_ID }} 
          amplify-branch: main
          # Point to your export directory from next.config.js
          build-dir: dist 
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-south-1
