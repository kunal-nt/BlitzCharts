name: Deploy to Amplify

on:
  pull_request: 
    branches: [ main, amplify-deploy-code ]
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Project
        run: npm run build
        env:
          NEXT_PUBLIC_APP_ENV: production
        
      - name: Build Folder
        run: ls
      
      # Amplify manual deployment requires the build folder to be zipped
      - name: Zip Build Output
        run: |
          cd out && zip -r ../build.zip . && cd ..

      - name: Deploy to AWS Amplify
        run: |
          APP_ID="${{ vars.AMPLIFY_APP_ID }}"
          BRANCH="main"

          # 1. Check for any running or pending jobs and stop them
          echo "Checking for stuck jobs..."
          STUCK_JOBS=$(aws amplify list-jobs --app-id $APP_ID --branch-name $BRANCH --query 'jobSummaries[?status==`PENDING` || status==`RUNNING` || status==`PROVISIONING`].jobId' --output text)
          
          for JOB in $STUCK_JOBS; do
            echo "Stopping stuck job: $JOB"
            aws amplify stop-job --app-id $APP_ID --branch-name $BRANCH --job-id $JOB || true
          done

          # 2. Create the new deployment
          echo "Creating new deployment..."
          aws amplify create-deployment --app-id $APP_ID --branch-name $BRANCH > deploy_info.json

          cat deploy_info.json
          
          UPLOAD_URL=$(jq -r '.zipUploadUrl' deploy_info.json)
          JOB_ID=$(jq -r '.jobId' deploy_info.json)

          # 3. Upload the zip file
          echo "Uploading build.zip..."
          curl -H "Content-Type: application/zip" --upload-file build.zip "$UPLOAD_URL"

          # 4. Start the deployment
          echo "Starting deployment for Job ID: $JOB_ID"
          aws amplify start-deployment --app-id $APP_ID --branch-name $BRANCH --job-id "$JOB_ID"

          # 5. Polling Loop: Verify status every 15 seconds
          while true; do
            STATUS=$(aws amplify get-job --app-id $APP_ID --branch-name $BRANCH --job-id $JOB_ID --query 'job.summary.status' --output text)
            echo "Current Status: $STATUS"
            
            if [ "$STATUS" = "SUCCEED" ]; then
              echo "✅ Deployment Successful!"
              break
            elif [ "$STATUS" = "FAILED" ]; then
              echo "❌ Deployment Failed!"
              exit 1
            fi
            sleep 15
          done

         
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ap-south-1

      - name: Website Health Check
        run: |
          # 6. Website Health Check
          # Replace 'your-app-url' with your actual Amplify domain if you have it as a variable
          APP_ID="${{ vars.AMPLIFY_APP_ID }}"
          BRANCH="main"
          echo "Performing final health check..."
          URL="https://${BRANCH}.${APP_ID}.amplifyapp.com" # Default Amplify URL format
          STATUS_CODE=$(curl -o /dev/null -s -w "%{http_code}" $URL)
          
          if [ "$STATUS_CODE" -eq 200 ] || [ "$STATUS_CODE" -eq 301 ]; then
            echo "🚀 Website is LIVE at $URL (Status: $STATUS_CODE)"
          else
            echo "⚠️ Deployment succeeded but website returned status: $STATUS_CODE"
            exit 1
          fi
          

