<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Gradient background -->
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"></stop> <!-- amber-100 -->
      <stop offset="100%" stop-color="#FEE2E2"></stop> <!-- red-100 -->
    </linearGradient>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="200" height="200" rx="24" fill="url(#grad)"></rect>

  <!-- Centered stacked bar chart icon -->
  <g transform="translate(50, 50) scale(4)">
    <path d="M11 13v4" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
    <path d="M15 5v4" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
    <path d="M3 3v16a2 2 0 0 0 2 2h16" stroke="#000000" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
    <rect x="7" y="13" width="9" height="4" rx="1" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></rect>
    <rect x="7" y="5" width="12" height="4" rx="1" stroke="#000000" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"></rect>
  </g>
</svg>
